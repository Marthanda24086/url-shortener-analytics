version: '3.8'

services:
  kairo-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kairo_production
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
      - JWT_SECRET=kairo_super_secret_production_ready_cryptographic_jwt_key_2026_x89a1
      - DATABASE_URL=file:/app/kairo.db
      - ANONYMIZER_SALT=kairo_daily_rotating_salt_for_privacy_hash_sec_9918
    volumes:
      - kairo_data:/app

volumes:
  kairo_data:
